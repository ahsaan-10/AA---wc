<title>FILED</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Instrument+Sans:ital,wght@0,400..700;1,400..600&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* FILED — design tokens.
   Colour does one job in this product: it encodes the stage a return is in.
   Everything structural is ink, paper and rule. If a colour on screen is not a
   status, it is a mistake. */

:root {
  color-scheme: light;

  /* Ground and surfaces — cool paper, never cream */
  --bg:            #E7EAEC;
  --panel:         #F8FAFA;
  --panel-raised:  #FFFFFF;
  --panel-sunk:    #EDF1F1;

  /* The single institutional ink */
  --accent:        #16283C;
  --accent-fg:     #F6F8F8;
  --accent-soft:   #24405E;

  /* Text */
  --text:          #16283C;
  --text-muted:    #55636F;
  --text-faint:    #7C8894;

  /* Ledger rules */
  --rule:          #D3DADC;
  --rule-strong:   #B6C1C4;
  --rule-hair:     #E1E6E7;

  --focus:         #1B5AA8;
  --shade:         rgba(16, 32, 46, 0.36);

  /* Stage colours */
  --st-intake:      #4E5C68;
  --st-docs:        #8A5600;
  --st-prep:        #0A6960;
  --st-review:      #493EA6;
  --st-signature:   #A2450A;
  --st-transmitted: #1B5AA8;
  --st-accepted:    #146239;
  --st-rejected:    #A61C15;
  --st-invoiced:    #5C6770;

  /* Diagnostic severity reuses the status set rather than inventing a second one */
  --sev-block:     var(--st-rejected);
  --sev-variance:  var(--st-docs);
  --sev-attention: var(--st-transmitted);

  --tab-h: 40px;
  --row-h: 34px;
}

@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg:            #0F1519;
    --panel:         #161E24;
    --panel-raised:  #1D272E;
    --panel-sunk:    #121A1F;

    --accent:        #CFDDE7;
    --accent-fg:     #0F1519;
    --accent-soft:   #A9BECD;

    --text:          #E5EBEE;
    --text-muted:    #A0AEB8;
    --text-faint:    #7C8B95;

    --rule:          #2A353D;
    --rule-strong:   #3B4952;
    --rule-hair:     #212B32;

    --focus:         #79B4F2;
    --shade:         rgba(0, 0, 0, 0.6);

    --st-intake:      #A6B5C0;
    --st-docs:        #D9A23F;
    --st-prep:        #46BFAF;
    --st-review:      #9F94EF;
    --st-signature:   #EE9A5C;
    --st-transmitted: #79B4F2;
    --st-accepted:    #5FC489;
    --st-rejected:    #F0827A;
    --st-invoiced:    #A3AEB7;
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --bg:            #0F1519;
  --panel:         #161E24;
  --panel-raised:  #1D272E;
  --panel-sunk:    #121A1F;

  --accent:        #CFDDE7;
  --accent-fg:     #0F1519;
  --accent-soft:   #A9BECD;

  --text:          #E5EBEE;
  --text-muted:    #A0AEB8;
  --text-faint:    #7C8B95;

  --rule:          #2A353D;
  --rule-strong:   #3B4952;
  --rule-hair:     #212B32;

  --focus:         #79B4F2;
  --shade:         rgba(0, 0, 0, 0.6);

  --st-intake:      #A6B5C0;
  --st-docs:        #D9A23F;
  --st-prep:        #46BFAF;
  --st-review:      #9F94EF;
  --st-signature:   #EE9A5C;
  --st-transmitted: #79B4F2;
  --st-accepted:    #5FC489;
  --st-rejected:    #F0827A;
  --st-invoiced:    #A3AEB7;
}

/* FILED — component layer. Structure comes from rules and alignment, not from
   putting everything in a rounded card with a shadow. */

*, *::before, *::after { box-sizing: border-box; }

html { -webkit-text-size-adjust: 100%; }

body {
  margin: 0;
  background: var(--bg);
  color: var(--text);
  font-family: 'Instrument Sans', ui-sans-serif, system-ui, -apple-system, 'Segoe UI', sans-serif;
  font-size: 14px;
  line-height: 1.45;
  font-variant-numeric: tabular-nums lining-nums;
  -webkit-font-smoothing: antialiased;
}

h1, h2, h3, h4 { margin: 0; font-weight: 600; letter-spacing: -0.012em; text-wrap: balance; }
h1 { font-size: 26px; letter-spacing: -0.02em; }
h2 { font-size: 18px; }
h3 { font-size: 15px; }
p { margin: 0; }
a { color: inherit; }

.mono {
  font-family: 'IBM Plex Mono', ui-monospace, 'SF Mono', Menlo, monospace;
  font-size: 0.92em;
  letter-spacing: -0.01em;
  white-space: nowrap;
}

.num { font-variant-numeric: tabular-nums lining-nums; }
.neg { color: var(--st-rejected); }

:focus-visible {
  outline: 2px solid var(--focus);
  outline-offset: 2px;
  border-radius: 2px;
}

.skip {
  position: absolute; left: 8px; top: -40px; z-index: 200;
  background: var(--accent); color: var(--accent-fg);
  padding: 8px 12px; border-radius: 3px; text-decoration: none;
  transition: top .12s;
}
.skip:focus { top: 8px; }

.sr {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ── Shell ─────────────────────────────────────────────────────────────── */

.app { display: grid; grid-template-columns: 224px minmax(0, 1fr); min-height: 100vh; }

.rail {
  position: sticky; top: 0; align-self: start; height: 100vh;
  display: flex; flex-direction: column; gap: 2px;
  background: var(--panel-sunk);
  border-right: 1px solid var(--rule);
  padding: 16px 0 12px;
  overflow-y: auto;
}

.brand { display: flex; align-items: center; gap: 9px; padding: 0 16px 14px; }
.brand-mark {
  width: 22px; height: 26px; flex: none; position: relative;
  background: var(--accent); border-radius: 2px 2px 2px 0;
  clip-path: polygon(0 0, 100% 0, 100% 78%, 62% 100%, 0 100%);
}
.brand-mark::after {
  content: ''; position: absolute; inset: 5px 5px auto 5px; height: 1px;
  background: var(--accent-fg); opacity: .55;
  box-shadow: 0 4px 0 var(--accent-fg), 0 8px 0 var(--accent-fg);
}
.brand-name { font-size: 16px; font-weight: 700; letter-spacing: .1em; }
.brand-sub { font-size: 11px; color: var(--text-faint); margin-top: -2px; }

.nav-group { padding: 10px 12px 4px; }
.nav-group-label { font-size: 11px; color: var(--text-faint); padding: 0 6px 6px; }

.nav-item {
  display: flex; align-items: center; gap: 8px;
  width: calc(100% - 16px); margin: 0 8px; padding: 6px 8px;
  border: 0; border-radius: 3px; background: none; color: var(--text-muted);
  font: inherit; font-size: 13px; text-align: left; cursor: pointer;
  text-decoration: none;
}
.nav-item:hover { background: color-mix(in srgb, var(--accent) 7%, transparent); color: var(--text); }
.nav-item[aria-current="page"] {
  background: color-mix(in srgb, var(--accent) 11%, transparent);
  color: var(--text); font-weight: 600;
  box-shadow: inset 2px 0 0 var(--accent);
}
.nav-count { margin-left: auto; font-size: 12px; color: var(--text-faint); }
.nav-dot { width: 7px; height: 7px; border-radius: 50%; flex: none; }

.rail-foot {
  margin-top: auto; padding: 12px 16px 0; border-top: 1px solid var(--rule);
  font-size: 11.5px; color: var(--text-faint); display: grid; gap: 3px;
}
.rail-foot .who { color: var(--text-muted); font-weight: 600; font-size: 12.5px; }

.main { display: flex; flex-direction: column; min-width: 0; }

.seasonbar {
  position: sticky; top: 0; z-index: 30;
  display: flex; align-items: center; gap: 14px;
  padding: 10px 24px; background: color-mix(in srgb, var(--bg) 88%, transparent);
  backdrop-filter: blur(6px);
  border-bottom: 1px solid var(--rule);
}
.crumb { font-size: 13px; color: var(--text-muted); display: flex; gap: 7px; align-items: center; min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.crumb b { overflow: hidden; text-overflow: ellipsis; }
.crumb b { color: var(--text); font-weight: 600; }
.crumb .sep { color: var(--text-faint); }

.kbutton {
  display: flex; align-items: center; gap: 8px; margin-left: auto;
  background: var(--panel); border: 1px solid var(--rule); color: var(--text-faint);
  border-radius: 3px; padding: 5px 8px 5px 10px; font: inherit; font-size: 12.5px; cursor: pointer;
}
.kbutton:hover { border-color: var(--rule-strong); color: var(--text-muted); }
kbd {
  font-family: 'IBM Plex Mono', monospace; font-size: 11px;
  border: 1px solid var(--rule); border-bottom-width: 2px; border-radius: 3px;
  padding: 1px 4px; background: var(--panel-raised); color: var(--text-muted);
}

.countdown { display: flex; align-items: baseline; gap: 6px; padding-left: 14px; border-left: 1px solid var(--rule); }
.countdown-n { font-size: 19px; font-weight: 700; letter-spacing: -0.02em; }
.countdown-l { font-size: 12px; color: var(--text-muted); }

.view { padding: 22px 24px 72px; max-width: 1560px; width: 100%; }
.view-head { display: flex; align-items: flex-end; gap: 16px; flex-wrap: wrap; margin-bottom: 18px; }
.view-head p { color: var(--text-muted); font-size: 13.5px; max-width: 68ch; }
.view-head .spacer { margin-left: auto; }

/* ── Buttons ───────────────────────────────────────────────────────────── */

.btn {
  display: inline-flex; align-items: center; gap: 7px; justify-content: center;
  padding: 7px 13px; border-radius: 3px; border: 1px solid var(--rule-strong);
  background: var(--panel-raised); color: var(--text);
  font: inherit; font-size: 13px; font-weight: 500; cursor: pointer;
  transition: background .12s, border-color .12s, transform .06s;
}
.btn:hover { border-color: var(--text-faint); }
.btn:active { transform: translateY(1px); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn-primary { background: var(--accent); border-color: var(--accent); color: var(--accent-fg); }
.btn-primary:hover { background: var(--accent-soft); border-color: var(--accent-soft); }
.btn-danger { background: var(--st-rejected); border-color: var(--st-rejected); color: #fff; }
:root[data-theme="dark"] .btn-danger, :root:not([data-theme="light"]) .btn-danger { color: #1A0E0D; }
.btn-quiet { background: none; border-color: transparent; color: var(--text-muted); padding: 5px 8px; }
.btn-quiet:hover { background: color-mix(in srgb, var(--accent) 8%, transparent); color: var(--text); }
.btn-sm { padding: 4px 9px; font-size: 12.5px; }

.linkish { background: none; border: 0; padding: 0; font: inherit; color: var(--text); cursor: pointer; text-decoration: underline; text-underline-offset: 2px; text-decoration-color: var(--rule-strong); }
.linkish:hover { text-decoration-color: currentColor; }

/* ── Panels ────────────────────────────────────────────────────────────── */

.panel { background: var(--panel); border: 1px solid var(--rule); border-radius: 4px; }
.panel-head {
  display: flex; align-items: center; gap: 10px;
  padding: 11px 14px; border-bottom: 1px solid var(--rule);
}
.panel-head h2, .panel-head h3 { font-size: 14px; }
.panel-head .spacer { margin-left: auto; }
.panel-note { font-size: 12.5px; color: var(--text-faint); }
.panel-body { padding: 14px; }
.panel-foot { padding: 10px 14px; border-top: 1px solid var(--rule); display: flex; gap: 8px; align-items: center; }

.grid { display: grid; gap: 16px; }
.cols-2 { grid-template-columns: minmax(0, 1.35fr) minmax(0, 1fr); }
.cols-3 { grid-template-columns: repeat(3, minmax(0, 1fr)); }
.stack { display: flex; flex-direction: column; gap: 16px; }
.row { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }

/* ── Status ────────────────────────────────────────────────────────────── */

.pill {
  display: inline-flex; align-items: center; gap: 6px;
  padding: 2px 8px 2px 7px; border-radius: 3px; font-size: 12px; font-weight: 500;
  white-space: nowrap; border: 1px solid transparent;
}
.pill .dot { width: 6px; height: 6px; border-radius: 50%; background: currentColor; flex: none; }
.pill[data-stage] { color: var(--sc); background: color-mix(in srgb, var(--sc) 12%, var(--panel)); border-color: color-mix(in srgb, var(--sc) 26%, transparent); }
[data-stage="intake"]      { --sc: var(--st-intake); }
[data-stage="docs"]        { --sc: var(--st-docs); }
[data-stage="prep"]        { --sc: var(--st-prep); }
[data-stage="review"]      { --sc: var(--st-review); }
[data-stage="signature"]   { --sc: var(--st-signature); }
[data-stage="transmitted"] { --sc: var(--st-transmitted); }
[data-stage="accepted"]    { --sc: var(--st-accepted); }
[data-stage="rejected"]    { --sc: var(--st-rejected); }
[data-stage="invoiced"]    { --sc: var(--st-invoiced); }

/* ── Ledger table ──────────────────────────────────────────────────────── */

.tablewrap { overflow-x: auto; }
table.ledger { width: 100%; border-collapse: collapse; font-size: 13px; }
.ledger thead th {
  position: sticky; top: 0; z-index: 2;
  background: var(--panel-sunk); text-align: left; font-weight: 600; font-size: 12px;
  color: var(--text-muted); padding: 8px 10px; white-space: nowrap;
  border-bottom: 1px solid var(--rule-strong);
}
.ledger thead th.sortable { cursor: pointer; user-select: none; }
.ledger thead th.sortable:hover { color: var(--text); }
.ledger thead th .arrow { opacity: .5; font-size: 10px; margin-left: 3px; }
.ledger tbody td { padding: 0 10px; height: var(--row-h); border-bottom: 1px solid var(--rule-hair); vertical-align: middle; }
.ledger tbody tr:hover td { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.ledger tbody tr[aria-selected="true"] td { background: color-mix(in srgb, var(--accent) 9%, transparent); }
.ledger .r { text-align: right; }
.ledger .clickable { cursor: pointer; }
.ledger .name { font-weight: 600; }
.ledger .sub { color: var(--text-faint); font-size: 12px; }
.ledger td.tight { white-space: nowrap; }

.checkcell { width: 34px; }
input[type="checkbox"] { accent-color: var(--accent); width: 14px; height: 14px; }

.toolbar { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; padding: 10px 14px; border-bottom: 1px solid var(--rule); }
.seg { display: flex; border: 1px solid var(--rule); border-radius: 3px; overflow: hidden; }
.seg button {
  border: 0; border-right: 1px solid var(--rule); background: var(--panel-raised);
  padding: 5px 10px; font: inherit; font-size: 12.5px; color: var(--text-muted); cursor: pointer;
}
.seg button:last-child { border-right: 0; }
.seg button[aria-pressed="true"] { background: var(--accent); color: var(--accent-fg); font-weight: 600; }
.seg button:hover:not([aria-pressed="true"]) { background: var(--panel-sunk); color: var(--text); }

.search {
  display: flex; align-items: center; gap: 7px; background: var(--panel-raised);
  border: 1px solid var(--rule); border-radius: 3px; padding: 4px 9px; min-width: 200px;
}
.search input { border: 0; background: none; font: inherit; font-size: 13px; color: var(--text); width: 100%; outline: none; }
.search svg { flex: none; opacity: .5; }

.bulkbar {
  display: flex; align-items: center; gap: 10px; padding: 8px 14px;
  background: var(--accent); color: var(--accent-fg); font-size: 13px;
}
.bulkbar .btn { background: transparent; border-color: color-mix(in srgb, var(--accent-fg) 40%, transparent); color: var(--accent-fg); }
.bulkbar .btn:hover { background: color-mix(in srgb, var(--accent-fg) 14%, transparent); }

/* ── Dashboard ─────────────────────────────────────────────────────────── */

.stageledger { display: grid; }
.stagerow {
  display: grid; grid-template-columns: 168px 52px minmax(0, 1fr); align-items: center; gap: 12px;
  padding: 7px 14px; border-bottom: 1px solid var(--rule-hair); cursor: pointer;
  background: none; border-left: 0; border-right: 0; border-top: 0; width: 100%; font: inherit; text-align: left; color: inherit;
}
.stagerow:last-child { border-bottom: 0; }
.stagerow:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.stagerow .label { display: flex; align-items: center; gap: 8px; font-size: 13px; }
.stagerow .count { font-size: 15px; font-weight: 600; text-align: right; }
.bar { display: block; height: 9px; background: var(--panel-sunk); border-radius: 1px; overflow: hidden; }
.bar span { display: block; height: 100%; background: var(--sc, var(--accent)); transform-origin: left center; }
.animate .bar span { animation: draw .5s cubic-bezier(.2,.7,.3,1) both; }
@keyframes draw { from { transform: scaleX(0); } to { transform: scaleX(1); } }

.risk { border-bottom: 1px solid var(--rule-hair); padding: 11px 14px; display: grid; gap: 4px; cursor: pointer; }
.risk:last-child { border-bottom: 0; }
.risk:hover { background: color-mix(in srgb, var(--accent) 5%, transparent); }
.risk-top { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.risk-name { font-weight: 600; }
.risk-why { color: var(--text-muted); font-size: 13px; max-width: 78ch; }
.sev { width: 3px; align-self: stretch; border-radius: 2px; background: var(--sc); }
.risk[data-sev="critical"] { --sc: var(--st-rejected); }
.risk[data-sev="high"]     { --sc: var(--st-docs); }
.risk[data-sev="medium"]   { --sc: var(--st-transmitted); }
.risk-strip { display: grid; grid-template-columns: 3px minmax(0,1fr); gap: 11px; }

.metrics { display: grid; grid-template-columns: repeat(auto-fit, minmax(132px, 1fr)); }
.metric { padding: 12px 14px; border-right: 1px solid var(--rule-hair); }
.metric:last-child { border-right: 0; }
.metric dt { font-size: 12px; color: var(--text-muted); margin-bottom: 3px; }
.metric dd { margin: 0; font-size: 20px; font-weight: 600; letter-spacing: -0.02em; }
.metric .foot { font-size: 12px; color: var(--text-faint); font-weight: 400; letter-spacing: 0; }

.capacity { display: grid; gap: 9px; }
.caprow { display: grid; grid-template-columns: 150px minmax(0,1fr) 68px; gap: 10px; align-items: center; font-size: 13px; }
.capbar { display: block; height: 7px; background: var(--panel-sunk); border-radius: 1px; overflow: hidden; position: relative; }
.capbar span { display: block; height: 100%; background: var(--st-prep); }
.capbar[data-over="true"] span { background: var(--st-docs); }
.capbar::after { content: ''; position: absolute; top: -3px; bottom: -3px; left: 90%; width: 1px; background: var(--rule-strong); }

.feed { display: grid; }
.feeditem { display: grid; grid-template-columns: 96px minmax(0,1fr); gap: 10px; padding: 8px 14px; border-bottom: 1px solid var(--rule-hair); font-size: 13px; }
.feeditem:last-child { border-bottom: 0; }
.feeditem time { color: var(--text-faint); font-size: 12.5px; }

/* ── Folder tabs (client record) ───────────────────────────────────────── */

.folder { margin-top: 4px; }
.folder-tabs { display: flex; align-items: flex-end; padding-left: 14px; gap: 1px; overflow-x: auto; scrollbar-width: none; }
.folder-tabs::-webkit-scrollbar { display: none; }
.ftab {
  position: relative; flex: none;
  transform: skewX(-11deg);
  background: var(--panel-sunk);
  border: 1px solid var(--rule); border-bottom: 0;
  border-radius: 5px 5px 0 0;
  padding: 7px 20px 8px; margin: 0 -1px;
  font: inherit; font-size: 13px; color: var(--text-muted); cursor: pointer;
  transition: background .12s, color .12s;
}
.ftab > span { display: block; transform: skewX(11deg); white-space: nowrap; }
.ftab:hover { background: color-mix(in srgb, var(--accent) 7%, var(--panel-sunk)); color: var(--text); }
.ftab[aria-selected="true"] {
  background: var(--panel); color: var(--text); font-weight: 600; z-index: 2;
  padding-bottom: 11px; box-shadow: inset 0 2px 0 var(--accent);
}
.ftab[aria-selected="true"]::after {
  content: ''; position: absolute; left: 1px; right: 1px; bottom: -1px; height: 2px; background: var(--panel);
}
.ftab .tabcount { color: var(--text-faint); font-weight: 400; margin-left: 5px; }
.folder-body { position: relative; z-index: 1; background: var(--panel); border: 1px solid var(--rule); border-radius: 0 4px 4px 4px; }

/* ── Detail lists ──────────────────────────────────────────────────────── */

.deflist { display: grid; grid-template-columns: auto 1fr; gap: 6px 16px; font-size: 13px; align-items: baseline; }
.deflist dt { color: var(--text-muted); }
.deflist dd { margin: 0; }

.kv { display: flex; justify-content: space-between; gap: 16px; padding: 7px 0; border-bottom: 1px solid var(--rule-hair); font-size: 13px; }
.kv:last-child { border-bottom: 0; }
.kv .k { color: var(--text-muted); }
.kv .v { font-weight: 500; }

.note { border-left: 2px solid var(--rule-strong); padding: 2px 0 2px 12px; display: grid; gap: 3px; }
.note-meta { font-size: 12px; color: var(--text-faint); }
.note-text { font-size: 13px; color: var(--text); max-width: 78ch; }

.checkitem { display: grid; grid-template-columns: 18px minmax(0,1fr) auto; gap: 10px; align-items: start; padding: 9px 0; border-bottom: 1px solid var(--rule-hair); }
.checkitem:last-child { border-bottom: 0; }
.checkitem .box {
  width: 15px; height: 15px; border: 1px solid var(--rule-strong); border-radius: 2px; margin-top: 2px;
  display: grid; place-items: center; font-size: 10px; color: var(--accent-fg); background: var(--panel-raised);
}
.checkitem[data-done="true"] .box { background: var(--st-accepted); border-color: var(--st-accepted); color: #fff; }
.checkitem .what { font-size: 13px; }
.checkitem .why { font-size: 12.5px; color: var(--text-muted); margin-top: 2px; max-width: 76ch; }

));

const MONTHS = ['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];

const fmt = {
  money(n, opts = {}) {
    const v = Math.abs(Math.round(n));
    const s = '$' + v.toLocaleString('en-US');
    if (opts.signed && n < 0) return '−' + s;
    return s;
  },
  /* A return either produces a refund or a balance due. Never show a bare number. */
  outcome(n) {
    if (n === 0) return 'Pass-through';
    return n > 0 ? fmt.money(n) + ' refund' : fmt.money(n) + ' due';
  },
  date(iso) {
    if (!iso) return '—';
    const d = new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''));
    return `${MONTHS[d.getMonth()]} ${d.getDate()}`;
  },
  dateFull(iso) {
    if (!iso) return '—';
    const d = new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''));
    return `${MONTHS[d.getMonth()]} ${d.getDate()}, ${d.getFullYear()}`;
  },
  time(iso) {
    if (!iso) return '—';
    const d = new Date(iso);
    let h = d.getHours(); const m = String(d.getMinutes()).padStart(2, '0');
    const ap = h < 12 ? 'am' : 'pm'; h = h % 12 || 12;
    return `${h}:${m} ${ap}`;
  },
  stamp(iso) { return `${fmt.date(iso.slice(0, 10))}, ${fmt.time(iso)}`; },
  pct(n) { return `${Math.round(n)}%`; },
  days(iso) {
    const a = new Date(SEASON.today + 'T12:00:00');
    const b = new Date(iso + (iso.length === 10 ? 'T12:00:00' : ''));
    return Math.round((a - b) / 86400000);
  }
};

  /* Stage moves are the spine of the product: one write, and every count,
     board column and queue that reads from it updates on the next render. */
  moveStage(id, stage, { silent = false, note = '' } = {}) {
    const c = this.client(id);
    if (!c) return;
    const from = stageMeta(c.stage).label;
    c.stage = stage;
    c.since = SEASON.today;
    if (note) c.notes.unshift({ on: SEASON.today, by: 'do', text: note });
    if (!silent) this.toast(`Moved to ${stageMeta(stage).label.toLowerCase()}`, `${c.name} — from ${from.toLowerCase()}`);
    render();
  },

  toast(text, sub = '') {
    const id = Math.random().toString(36).slice(2);
    this.state.toasts.push({ id, text, sub });
    renderToasts();
    setTimeout(() => {
      this.state.toasts = this.state.toasts.filter((t) => t.id !== id);
      renderToasts();
    }, 5200);
  },

  draft(key, value) {
    if (value === undefined) return this.state.drafts[key] ?? '';
    this.state.drafts[key] = value;
    return value;
  },

  go(hash) {
    if (location.hash === hash) { route(); return; }
    location.hash = hash;

let lastFocused = null;

function confirmAction({ title, body, consent, confirmLabel, tone = 'danger', detail = '' }) {
  return new Promise((resolve) => {
    lastFocused = document.activeElement;
    const wrap = document.createElement('div');
    wrap.className = 'scrim center';
    wrap.innerHTML = `
      <div class="modal" role="dialog" aria-modal="true" aria-labelledby="mtitle">
        <div class="modal-head"><h2 id="mtitle">${esc(title)}</h2></div>
        <div class="modal-body">
          <p>${body}</p>
          ${detail ? `<div class="panel" style="background:var(--panel-sunk)"><div class="panel-body" style="padding:10px 12px">${detail}</div></div>` : ''}
          ${consent ? `<label class="consent"><input type="checkbox" id="consent"><span>${esc(consent)}</span></label>` : ''}
        </div>
        <div class="modal-foot">
          <button class="btn" data-x="cancel">Cancel</button>
          <button class="btn btn-${tone}" data-x="ok" ${consent ? 'disabled' : ''}>${esc(confirmLabel)}</button>
        </div>
      </div>`;
    document.body.appendChild(wrap);

    const ok = $('[data-x="ok"]', wrap);
    const consentBox = $('#consent', wrap);
    if (consentBox) consentBox.addEventListener('change', () => { ok.disabled = !consentBox.checked; });

    const close = (val) => {
      wrap.remove();
      if (lastFocused && lastFocused.focus) lastFocused.focus();
      resolve(val);
    };
    $('[data-x="cancel"]', wrap).addEventListener('click', () => close(false));
    ok.addEventListener('click', () => close(true));
    wrap.addEventListener('click', (e) => { if (e.target === wrap) close(false); });
    wrap.addEventListener('keydown', (e) => {
      if (e.key === 'Escape') close(false);
      if (e.key === 'Tab') {
        const f = $$('button, input', wrap);
        const i = f.indexOf(document.activeElement);
        if (e.shiftKey && i <= 0) { e.preventDefault(); f[f.length - 1].focus(); }
        else if (!e.shiftKey && i === f.length - 1) { e.preventDefault(); f[0].focus(); }
      }
    });
    (consentBox || ok).focus();
  });
}

const PALETTE_ACTIONS = [
  { title: 'Transmit signed returns to the IRS', hash: '#/efile', sub: 'E-file centre' },
  { title: 'Open the reject lane', hash: '#/efile', sub: 'Returns the IRS sent back' },
  { title: 'Draft a document reminder', hash: '#/documents', sub: 'Document chase' },
  { title: 'File Form 4868 extension', hash: '#/deadlines', sub: 'Deadline board' }
];

let paletteState = { open: false, q: '', active: 0, results: [] };

function paletteResults(q) {
  const term = q.trim().toLowerCase();
  const clients = App.state.clients
    .filter((c) => !term || c.name.toLowerCase().includes(term) || c.id.toLowerCase().includes(term)
      || (c.occupation || '').toLowerCase().includes(term) || (c.business || '').toLowerCase().includes(term)
      || c.entity.toLowerCase().includes(term))
    .slice(0, term ? 7 : 5)
    .map((c) => ({ kind: 'Client', title: c.name, sub: `${c.id} · ${c.entity} · ${stageMeta(c.stage).label}`, hash: `#/client/${c.id}/overview` }));

  const screens = PALETTE_SCREENS
    .filter((s) => !term || s.title.toLowerCase().includes(term) || s.sub.toLowerCase().includes(term))
    .map((s) => ({ kind: 'Screen', ...s }));

  const actions = PALETTE_ACTIONS
    .filter((a) => !term || a.title.toLowerCase().includes(term))
    .map((a) => ({ kind: 'Action', ...a }));

  const rejects = App.state.clients.filter((c) => c.stage === 'rejected')
    .filter((c) => !term || c.reject.code.toLowerCase().includes(term) || c.name.toLowerCase().includes(term))
    .map((c) => ({ kind: 'Reject', title: `${c.reject.code} — ${c.name}`, sub: 'Open reject resolution', hash: `#/reject/${c.id}` }));

  return [...clients, ...(term ? rejects : []), ...screens, ...actions].slice(0, 12);
}

function openPalette() {
  paletteState = { open: true, q: '', active: 0, results: paletteResults('') };
  lastFocused = document.activeElement;
  const wrap = document.createElement('div');
  wrap.className = 'scrim top';
  wrap.id = 'palette';
  wrap.innerHTML = `
    <div class="palette" role="dialog" aria-modal="true" aria-label="Command palette">
      <div class="palette-input">
        <svg width="15" height="15" viewBox="0 0 16 16" fill="none" aria-hidden="true"><circle cx="7" cy="7" r="5" stroke="currentColor" stroke-width="1.4"/><path d="M11 11l4 4" stroke="currentColor" stroke-width="1.4"/></svg>
        <input id="pq" type="text" placeholder="Jump to a client, return, reject code or screen" aria-label="Search" autocomplete="off">
      </div>
      <div class="palette-results" id="presults"></div>
      <div class="palette-foot"><span><kbd>↑</kbd><kbd>↓</kbd> move</span><span><kbd>↵</kbd> open</span><span><kbd>esc</kbd> close</span></div>
    </div>`;
  document.body.appendChild(wrap);
  drawPalette();

  const input = $('#pq', wrap);
  input.addEventListener('input', () => {
    paletteState.q = input.value;
    paletteState.results = paletteResults(input.value);
    paletteState.active = 0;
    drawPalette();
  });
  wrap.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') { closePalette(); }
    if (e.key === 'ArrowDown') { e.preventDefault(); paletteState.active = Math.min(paletteState.active + 1, paletteState.results.length - 1); drawPalette(); }
    if (e.key === 'ArrowUp') { e.preventDefault(); paletteState.active = Math.max(paletteState.active - 1, 0); drawPalette(); }
    if (e.key === 'Enter') {
      const r = paletteState.results[paletteState.active];
      if (r) { closePalette(); App.go(r.hash); }
    }
  });
  wrap.addEventListener('click', (e) => {
    if (e.target === wrap) return closePalette();
    const btn = e.target.closest('.presult');
    if (btn) { const r = paletteState.results[Number(btn.dataset.i)]; closePalette(); App.go(r.hash); }
  });
  input.focus();
}

function drawPalette() {
  const box = $('#presults');
  if (!box) return;
  if (!paletteState.results.length) {
    box.innerHTML = `<div class="empty" style="padding:30px 20px">
      <h3>Nothing matches “${esc(paletteState.q)}”</h3>
      <p>Try a surname, a client ID such as ${idTag('RAG-0118')}, a reject code, or the name of a screen.</p>
    </div>`;
    return;
  }
  let lastKind = null;
  box.innerHTML = paletteState.results.map((r, i) => {
    const head = r.kind !== lastKind ? `<div class="palette-group">${esc(r.kind === 'Client' ? 'Clients' : r.kind === 'Screen' ? 'Screens' : r.kind === 'Reject' ? 'Rejected returns' : 'Actions')}</div>` : '';
    lastKind = r.kind;
    return head + `
      <button class="presult" data-i="${i}" data-active="${i === paletteState.active}">
        <span class="pkind">${r.kind === 'Client' ? '◧' : r.kind === 'Reject' ? '⚑' : r.kind === 'Action' ? '›' : '▤'}</span>
        <span><span class="ptitle">${esc(r.title)}</span><br><span class="psub">${esc(r.sub)}</span></span>
        <span class="pkind">${esc(r.kind)}</span>
      </button>`;
  }).join('');
}

function closePalette() {
  paletteState.open = false;
  const el = $('#palette');
  if (el) el.remove();
  if (lastFocused && lastFocused.focus) lastFocused.focus();
}

const VIEWS = [

  { key: 'new',    label: 'New this season' }
];

function rosterRows() {
  const { view, q, sort } = App.state.roster;
  let rows = App.state.clients.slice();

  if (App.state.roster.stage) rows = rows.filter((c) => c.stage === App.state.roster.stage);
  if (view === 'mine')  rows = rows.filter((c) => c.preparer === 'do' || c.reviewer === 'do');
  if (view === 'stuck') rows = rows.filter((c) => stuckDays(c) >= 5);
  if (view === 'new')   rows = rows.filter((c) => c.since_year === 2026);

  const term = q.trim().toLowerCase();
  if (term) {
    rows = rows.filter((c) => [c.name, c.id, c.occupation, c.business, c.entity, stageMeta(c.stage).label]
      .join(' ').toLowerCase().includes(term));
  }

  const dir = sort.dir === 'asc' ? 1 : -1;
  const val = (c) => ({
    name: c.name.replace(/^(Mr|Ms) /, ''),
    id: c.id,
    entity: c.entity,
    stage: STAGES.findIndex((s) => s.key === c.stage),
    preparer: staffName(c.preparer),
    due: c.due,
    since: -stuckDays(c),
    fee: c.fee
  }[sort.key]);

  rows.sort((a, b) => {
    const x = val(a), y = val(b);
    if (x === y) return a.name.localeCompare(b.name);
    return (x > y ? 1 : -1) * dir;
  });
  return rows;
}

const CLIENT_TABS = ['overview', 'documents', 'returns', 'messages', 'billing'];

function feeLedger(c) {
  const rows = [...c.years].reverse().concat([{ y: SEASON.taxYear, fee: c.fee, current: true }]);
  const max = Math.max(...rows.map((r) => r.fee));
  return `
    <table class="compare">
      <thead><tr><th>Tax year</th><th>Fee</th><th style="width:46%">&nbsp;</th><th class="r">Change</th></tr></thead>
      <tbody>
        ${rows.map((r, i) => {
          const prev = i > 0 ? rows[i - 1].fee : null;
          const chg = prev ? ((r.fee - prev) / prev) * 100 : null;
          return `<tr>
            <td class="tight">${r.y}${r.current ? ' <span class="panel-note">current</span>' : ''}</td>
            <td class="num">${fmt.money(r.fee)}</td>
            <td><span class="bar" style="--sc:var(--st-invoiced)"><span style="width:${(r.fee / max) * 100}%"></span></span></td>
            <td class="r">${chg === null ? '<span class="delta" data-dir="flat">—</span>'
              : `<span class="delta" data-dir="${chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat'}">${chg > 0 ? '+' : ''}${chg.toFixed(1)}%</span>`}</td>
          </tr>`;
        }).join('')}
      </tbody>
    </table>`;
}

const ClientScreen = {
  crumb(params) { const c = App.client(params[0]); return c ? c.name : 'Client'; },

  render(params) {
    const c = App.client(params[0]);
    if (!c) return NotFoundScreen.render();
    const tab = CLIENT_TABS.includes(params[1]) ? params[1] : 'overview';
    const out = outstandingDocs(c).length;
    const sig = signatureOf(c.id);

    const tabs = [
      ['overview', 'Overview', ''],
      ['documents', 'Documents', out ? String(out) : ''],
      ['returns', 'Returns', String(c.years.length + 1)],
      ['messages', 'Messages', String((CHASE_LOG[c.id] || []).length + c.notes.length)],
      ['billing', 'Billing', '']
    ].map(([key, label, count]) => `
      <button class="ftab" role="tab" aria-selected="${tab === key}" data-action="client-tab" data-arg="${c.id}/${key}">
        <span>${label}${count ? `<span class="tabcount">${count}</span>` : ''}</span>
      </button>`).join('');

    return `
    <div class="view">
      <div class="view-head">
        <div>
          <div class="row" style="gap:9px">
            <h1>${esc(c.name)}</h1>
            ${pill(c.stage)}
          </div>
          <p>${esc(c.occupation)}${c.business ? ` · ${esc(c.business)}` : ''} · client since ${c.since_year} · ${c.kind === 'business' ? 'EIN' : 'SSN'} <span class="mono">${esc(c.ssn || c.ein)}</span></p>
        </div>
        <div class="spacer"></div>
        <div class="row">
          <button class="btn" data-action="goto" data-arg="#/documents">Chase documents</button>
          <button class="btn btn-primary" data-action="goto" data-arg="#/return/${c.id}">Open return workspace</button>
        </div>
      </div>

      <div class="folder">
        <div class="folder-tabs" role="tablist">${tabs}</div>
        <div class="folder-body" role="tabpanel">${this.tab(c, tab, sig)}</div>
      </div>
    </div>`;
  },

  tab(c, tab, sig) {
    if (tab === 'overview') {
      const last = c.years[0];
      return `
      <div class="grid cols-2" style="padding:16px; gap:20px">
        <div class="stack">
          <div>
            <h3 style="margin-bottom:10px">This year’s return</h3>
            <div class="kv"><span class="k">Return type</span><span class="v">${esc(c.entity)} · ${esc(c.filing)}</span></div>
            <div class="kv"><span class="k">Forms in scope</span><span class="v">${c.forms.map((f) => esc(f)).join(', ')}</span></div>
            <div class="kv"><span class="k">Stage</span><span class="v">${stageMeta(c.stage).label}, ${stuckDays(c)} ${stuckDays(c) === 1 ? 'day' : 'days'}</span></div>
            <div class="kv"><span class="k">Due</span><span class="v">${fmt.dateFull(c.due)}${c.due === SEASON.businessDue ? ' — March 15 is a Sunday' : ''}</span></div>
            <div class="kv"><span class="k">Preparer</span><span class="v">${esc(staffName(c.preparer))}, ${staffById(c.preparer).cred}</span></div>
            <div class="kv"><span class="k">Reviewer</span><span class="v">${esc(staffName(c.reviewer))}, ${staffById(c.reviewer).cred}</span></div>
            <div class="kv"><span class="k">Result</span><span class="v">${c.current.refundOrDue === 'unknown' ? 'Not yet calculated' : fmt.outcome(c.current.result)}</span></div>
            ${sig ? `<div class="kv"><span class="k">Form 8879</span><span class="v">${sig.signed ? `Signed ${fmt.stamp(sig.signed)}` : `Sent ${fmt.stamp(sig.sent)}, unsigned`}</span></div>` : ''}
          </div>

          <div>
            <h3 style="margin-bottom:8px">Internal notes</h3>
            <div class="stack" style="gap:12px">
              ${c.notes.map((n) => `
                <div class="note">
                  <div class="note-meta">${fmt.dateFull(n.on)} · ${esc(staffName(n.by))}</div>
                  <p class="note-text">${esc(n.text)}</p>
                </div>`).join('')}
            </div>
          </div>
        </div>

        <div class="stack">
          <div>
            <h3 style="margin-bottom:10px">Prior years</h3>
            <table class="compare">
              <thead><tr><th>Year</th><th class="r">AGI</th><th class="r">Result</th><th class="r">Filed</th></tr></thead>
              <tbody>
                ${c.years.map((y) => `<tr>
                  <td>${y.y}${y.extended ? ' <span class="panel-note">extended</span>' : ''}</td>
                  <td class="r num">${y.agi ? fmt.money(y.agi) : '—'}</td>
                  <td class="r num">${y.result === 0 ? 'Pass-through' : fmt.outcome(y.result)}</td>
                  <td class="r">${fmt.date(y.filed)}</td>
                </tr>`).join('')}
              </tbody>
            </table>
            <p class="panel-note" style="margin-top:8px">Last filed ${fmt.dateFull(last.filed)}${last.extended ? ' on extension' : ''}.</p>
          </div>

          <div>
            <h3 style="margin-bottom:10px">Fee history</h3>
            ${feeLedger(c)}
          </div>

          <div>
            <h3 style="margin-bottom:8px">Contact</h3>
            <div class="kv"><span class="k">Email</span><span class="v">${esc(c.email)}</span></div>
            <div class="kv"><span class="k">Phone</span><span class="v">${esc(c.phone)}</span></div>
          </div>
        </div>
      </div>`;
    }

    if (tab === 'documents') {
      const chases = CHASE_LOG[c.id] || [];
      return `
      <div class="grid cols-2" style="padding:16px; gap:20px">
        <div>
          <h3 style="margin-bottom:4px">Document checklist</h3>
          <p class="panel-note" style="margin-bottom:8px">${outstandingDocs(c).length ? `${outstandingDocs(c).length} outstanding` : 'Everything is in'}</p>
          ${c.docs.map((d) => `
            <div class="checkitem" data-done="${isDocIn(c, d)}">
              <span class="box">${isDocIn(c, d) ? '✓' : ''}</span>
              <div>
                <div class="what">${esc(d.form)} <span class="panel-note">${esc(d.from)}</span></div>
                ${d.note ? `<div class="why">${esc(d.note)}</div>` : ''}
                ${d.amount ? `<div class="why num">${fmt.money(d.amount)}</div>` : ''}
              </div>
              <div class="panel-note" style="white-space:nowrap">${isDocIn(c, d) ? `In ${fmt.date(d.on || SEASON.today)}` : `Asked ${fmt.date(d.requested)}`}</div>
            </div>`).join('')}
        </div>
        <div>
          <h3 style="margin-bottom:8px">Chase history</h3>
          ${chases.length ? chases.map((ch) => `
            <div class="checkitem" data-done="true" style="grid-template-columns:minmax(0,1fr) auto">
              <div>
                <div class="what">${esc(ch.via)} · ${esc(staffName(ch.by))}</div>
                <div class="why">${esc(ch.note)}</div>
              </div>
              <div class="panel-note">${fmt.stamp(ch.on)}</div>
            </div>`).join('')
          : `<p class="panel-note">Nothing has been chased. Every document arrived without being asked for twice.</p>`}
          <div class="row" style="margin-top:14px">
            <button class="btn" data-action="goto" data-arg="#/documents">Open the chase queue</button>
          </div>
        </div>
      </div>`;
    }

    if (tab === 'returns') {
      return `
      <div style="padding:16px">
        <h3 style="margin-bottom:10px">Return history</h3>
        <div class="tablewrap">
          <table class="ledger">
            <thead><tr><th>Tax year</th><th>Forms</th><th class="r">AGI</th><th class="r">Result</th><th class="r">Fee</th><th class="r">Filed</th><th>Outcome</th></tr></thead>
            <tbody>
              <tr>
                <td>${SEASON.taxYear} <span class="panel-note">current</span></td>
                <td>${c.forms.slice(0, 3).map(esc).join(', ')}${c.forms.length > 3 ? ` +${c.forms.length - 3}` : ''}</td>
                <td class="r num">${c.current.agi ? fmt.money(c.current.agi) : '—'}</td>
                <td class="r num">${c.current.refundOrDue === 'unknown' ? '—' : fmt.outcome(c.current.result)}</td>
                <td class="r num">${fmt.money(c.fee)}</td>
                <td class="r">—</td>
                <td>${pill(c.stage)}</td>
              </tr>
              ${c.years.map((y) => `<tr>
                <td>${y.y}</td>
                <td class="panel-note">As filed</td>
                <td class="r num">${y.agi ? fmt.money(y.agi) : '—'}</td>
                <td class="r num">${y.result === 0 ? 'Pass-through' : fmt.outcome(y.result)}</td>
                <td class="r num">${fmt.money(y.fee)}</td>
                <td class="r">${fmt.date(y.filed)}</td>
                <td>${y.extended ? '<span class="pill" data-stage="docs"><span class="dot"></span>Extended on 4868</span>' : '<span class="pill" data-stage="accepted"><span class="dot"></span>Accepted</span>'}</td>
              </tr>`).join('')}
            </tbody>
          </table>
        </div>
        <div style="max-width:520px; margin-top:20px">
          <h3 style="margin-bottom:10px">Fee history</h3>
          ${feeLedger(c)}
        </div>
      </div>`;
    }

    if (tab === 'messages') {
      const chases = CHASE_LOG[c.id] || [];
      const draftKey = `msg::${c.id}`;
      const template = CHASE_TEMPLATES[c.id];
      return `
      <div class="grid cols-2" style="padding:16px; gap:20px">
        <div>
          <h3 style="margin-bottom:10px">Thread</h3>
          <div class="stack" style="gap:12px">
            ${chases.map((ch) => `
              <div class="note">
                <div class="note-meta">${fmt.stamp(ch.on)} · ${esc(staffName(ch.by))} · ${esc(ch.via)}</div>
                <p class="note-text">${esc(ch.note)}</p>
              </div>`).join('')}
            ${c.notes.map((n) => `
              <div class="note" style="border-left-color:var(--st-review)">
                <div class="note-meta">${fmt.dateFull(n.on)} · ${esc(staffName(n.by))} · internal note</div>
                <p class="note-text">${esc(n.text)}</p>
              </div>`).join('')}
          </div>
        </div>
        <div>
          <h3 style="margin-bottom:10px">Write to ${esc(c.name.split(' ')[0])}</h3>
          <label class="field">
            <span>Message</span>
            <textarea id="clientmsg" data-draft="${draftKey}" placeholder="${template ? 'A draft is loaded below — edit it before sending.' : 'Write to the client…'}">${esc(App.draft(draftKey) || (template ? template.body : ''))}</textarea>
          </label>
          <div class="row" style="margin-top:10px">
            <button class="btn btn-primary" data-action="send-message" data-arg="${c.id}">Send message</button>
            <span class="panel-note">${template ? esc(template.channel) : 'Portal message'}</span>
          </div>
        </div>
      </div>`;
    }

    /* billing */
    const inv = App.state.invoices.filter((i) => i.client === c.id);
    return `
    <div style="padding:16px">
      <h3 style="margin-bottom:10px">Invoices</h3>
      ${inv.length ? `
      <div class="tablewrap">
        <table class="ledger">
          <thead><tr><th>Invoice</th><th>Issued</th><th class="r">Standard</th><th class="r">Billed</th><th class="r">Written off</th><th class="r">Paid</th><th>Status</th></tr></thead>
          <tbody>${inv.map((i) => `
            <tr>
              <td class="mono">${i.no}</td>
              <td>${fmt.date(i.issued)}</td>
              <td class="r num">${fmt.money(i.standard)}</td>
              <td class="r num">${fmt.money(i.billed)}</td>
              <td class="r num">${i.writeOff ? fmt.money(i.writeOff) : '—'}</td>
              <td class="r num">${fmt.money(i.paid)}</td>
              <td>${invoiceStatusPill(i.status)}</td>
            </tr>`).join('')}
          </tbody>
        </table>
      </div>
      ${inv.filter((i) => i.note).map((i) => `<p class="panel-note" style="margin-top:10px">${i.no}: ${esc(i.note)}</p>`).join('')}`
      : `<div class="empty">
          <div class="empty-mark"></div>
          <h3>Nothing invoiced yet</h3>
          <p>The fee of ${fmt.money(c.fee)} is billed once the IRS accepts the return. Nothing to do here today.</p>
          <button class="btn" data-action="goto" data-arg="#/billing">Open billing</button>
        </div>`}
      <div style="max-width:520px; margin-top:20px">${feeLedger(c)}</div>
    </div>`;
  },

  after() {
    const t = $('#clientmsg');
    if (t) t.addEventListener('input', (e) => App.draft(e.target.dataset.draft, e.target.value));
  }
};

function invoiceStatusPill(status) {
  const map = { paid: 'accepted', sent: 'transmitted', overdue: 'rejected', partial: 'signature', draft: 'intake' };
  const label = { paid: 'Paid', sent: 'Sent', overdue: 'Overdue', partial: 'Part paid', draft: 'Draft' }[status];
  return `<span class="pill" data-stage="${map[status]}"><span class="dot"></span>${label}</span>`;
}

/* FILED — screens: document chase, return workspace, review queue,
   e-file centre, reject resolution. */

/* ── 5. Document intake and chase ──────────────────────────────────────── */

const DocumentsScreen = {
  crumb: 'Document chase',
  render(params) {
    const waiting = App.state.clients
      .filter((c) => outstandingDocs(c).length)
      .sort((a, b) => {
        const oldest = (c) => Math.min(...outstandingDocs(c).map((d) => fmt.days(d.requested || SEASON.today)));
        return oldest(b) - oldest(a);
      });

    if (!waiting.length) {
      return `
      <div class="view">
        <div class="view-head"><div><h1>Document chase</h1></div></div>
        <section class="panel"><div class="empty">
          <div class="empty-mark"></div>
          <h3>Every folder is complete</h3>
          <p>Nothing is outstanding across the roster. The next thing worth doing is clearing the review queue — four returns are waiting on a reviewer.</p>
          <button class="btn btn-primary" data-action="goto" data-arg="#/review">Open the review queue</button>
        </div></section>
      </div>`;
    }

    const current = App.client(params[0]) && outstandingDocs(App.client(params[0])).length
      ? App.client(params[0]) : waiting[0];

    const list = waiting.map((c) => {
      const out = outstandingDocs(c);
      const oldest = Math.max(...out.map((d) => fmt.days(d.requested || SEASON.today)));
      const chases = (CHASE_LOG[c.id] || []).length;
      return `
      <button class="stagerow" style="grid-template-columns:minmax(0,1fr) auto; align-items:start; padding:11px 14px"
              data-action="goto" data-arg="#/documents/${c.id}" aria-current="${c.id === current.id ? 'true' : 'false'}">
        <span>
          <span class="name" style="font-weight:600">${esc(c.name)}</span>
          <span class="sub" style="display:block; color:var(--text-muted); font-size:12.5px">
            ${out.length} outstanding · asked ${oldest} ${oldest === 1 ? 'day' : 'days'} ago · ${chases} ${chases === 1 ? 'chase' : 'chases'} sent
          </span>
        </span>
        <span>${pill(c.stage)}</span>
      </button>`;
    }).join('');

    const c = current;
    const tpl = CHASE_TEMPLATES[c.id];
    const draftKey = `chase::${c.id}`;
    const chases = CHASE_LOG[c.id] || [];
    const internal = chases.every((ch) => ch.via === 'Internal');

    return `
    <div class="view">
      <div class="view-head">
        <div>
          <h1>Document chase</h1>
          <p>${waiting.length} clients are holding up their own returns. Sorted by how long the oldest request has been sitting.</p>
        </div>
      </div>

      <div class="grid" style="grid-template-columns:minmax(280px, 360px) minmax(0,1fr)">
        <section class="panel" style="align-self:start">
          <div class="panel-head"><h2>Waiting on documents</h2><span class="spacer"></span><span class="panel-note">${waiting.length}</span></div>
          ${list}
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>${esc(c.name)}</h2>
            ${pill(c.stage)}
            <span class="spacer"></span>
            <button class="btn btn-sm" data-action="open-client" data-arg="${c.id}">Open client record</button>
          </div>

          <div class="panel-body">
            <div class="grid cols-2" style="gap:22px">
              <div>
                <h3 style="margin-bottom:8px">Checklist</h3>
                ${c.docs.map((d) => `
                  <div class="checkitem" data-done="${isDocIn(c, d)}">
                    <span class="box">${isDocIn(c, d) ? '✓' : ''}</span>
                    <div>
                      <div class="what">${esc(d.form)} <span class="panel-note">${esc(d.from)}</span></div>
                      ${d.note ? `<div class="why">${esc(d.note)}</div>` : ''}
                    </div>
                    <div style="white-space:nowrap">
                      ${isDocIn(c, d)
                        ? `<span class="panel-note">In ${fmt.date(d.on || SEASON.today)}</span>`
                        : `<button class="btn btn-sm" data-action="doc-received" data-arg="${c.id}::${d.form}">Mark received</button>`}
                    </div>
                  </div>`).join('')}

                <h3 style="margin:18px 0 8px">What has been chased</h3>
                ${chases.length ? chases.map((ch) => `
                  <div class="note" style="margin-bottom:10px">
                    <div class="note-meta">${fmt.stamp(ch.on)} · ${esc(staffName(ch.by))} · ${esc(ch.via)}</div>
                    <p class="note-text">${esc(ch.note)}</p>
                  </div>`).join('')
                : '<p class="panel-note">Nothing sent yet.</p>'}
                ${internal && chases.length ? `<p class="panel-note">This one is on us, not on the client. No reminder should go out.</p>` : ''}
              </div>

              <div>
                <h3 style="margin-bottom:8px">Reminder</h3>
                ${tpl ? `
                  <label class="field">
                    <span>Subject</span>
                    <input type="text" id="chasesubject" data-draft="${draftKey}::subject" value="${esc(App.draft(draftKey + '::subject') || tpl.subject)}">
                  </label>
                  <label class="field" style="margin-top:10px">
                    <span>Message · ${esc(tpl.channel)}</span>
                    <textarea id="chasebody" data-draft="${draftKey}" style="min-height:230px">${esc(App.draft(draftKey) || tpl.body)}</textarea>
                  </label>
                  <div class="row" style="margin-top:10px">
                    <button class="btn btn-primary" data-action="send-chase" data-arg="${c.id}">Send reminder</button>
                    <span class="panel-note">Logged against the client record</span>
                  </div>`
                : `<div class="banner" data-tone="info">
                    <span class="sev"></span>
                    <div><b>No reminder drafted</b><p>The outstanding item is produced in-house, so there is nothing to ask the client for.</p></div>
                    <button class="btn btn-sm" data-action="goto" data-arg="#/review">Open review queue</button>
                  </div>`}
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>`;
  },

  after() {
    $$('[data-draft]').forEach((el) => el.addEventListener('input', (e) => App.draft(e.target.dataset.draft, e.target.value)));
  }
};

/* ── 6. Return workspace ───────────────────────────────────────────────── */

function comparisonTable(c) {
  const lines = RETURN_LINES[c.id];
  const prior = c.years[0];

  const rows = lines ? lines.rows : [
    { label: 'Adjusted gross income', form: 'Form 1040, line 11', now: c.current.agi, prior: prior.agi }
  ];

  const body = rows.map((r) => {
    const chg = r.prior ? ((r.now - r.prior) / r.prior) * 100 : null;
    const big = chg !== null && Math.abs(chg) >= 20;
    return `
    <tr${r.rule ? ' class="total"' : ''}>
      <td>${esc(r.label)}<div class="panel-note">${esc(r.form)}</div></td>
      <td class="r num">${fmt.money(r.now)}</td>
      <td class="r num" style="color:var(--text-muted)">${fmt.money(r.prior)}</td>
      <td class="r"><span class="delta" data-dir="${chg > 0 ? 'up' : chg < 0 ? 'down' : 'flat'}">${chg === null ? '—' : `${chg > 0 ? '+' : '−'}${Math.abs(chg).toFixed(1)}%`}${big ? ' ⚑' : ''}</span></td>
    </tr>`;
  }).join('');

  const outcome = lines ? lines.outcome : { now: c.current.result, prior: prior.result };

  return `
  <table class="compare">
    <thead>
      <tr><th>Line</th><th class="r">${SEASON.taxYear}</th><th class="r">${SEASON.taxYear - 1}</th><th class="r">Change</th></tr>
    </thead>
    <tbody>
      ${body}
      <tr class="total">
        <td>${outcome.now > 0 ? 'Refund' : 'Balance due'}</td>
        <td class="r num">${fmt.outcome(outcome.now)}</td>
        <td class="r num" style="color:var(--text-muted)">${fmt.outcome(outcome.prior)}</td>
        <td class="r"><span class="delta" data-dir="${outcome.now < outcome.prior ? 'up' : 'down'}">${fmt.money(Math.abs(outcome.now - outcome.prior))}</span></td>
      </tr>
    </tbody>
  </table>
  ${lines ? `<p class="panel-note" style="margin-top:10px; max-width:70ch">${esc(lines.note)} A change of 20% or more is flagged.</p>`
    : `<p class="panel-note" style="margin-top:10px">Line-level comparison appears once the return is calculated. Prior year is shown as filed${prior.extended ? ' on extension' : ''}.</p>`}`;
}

const ReturnScreen = {
  crumb(params) { const c = App.client(params[0]); return c ? `${c.name} — return` : 'Return'; },

  render(params) {
    const c = App.client(params[0]);
    if (!c) return NotFoundScreen.render();

    const diags = (c.diagnostics || []).map((d) => ({ ...d, resolved: App.state.resolved.includes(c.id + '::' + d.code) }));
    const blockers = diags.filter((d) => d.sev === 'block' && !d.resolved);
    const forms = FORM_STATUS[c.id] || c.forms.map((f) => ({ form: f, state: 'done', note: '' }));
    const done = forms.filter((f) => f.state === 'done').length;

    const sevLabel = { block: 'Blocks transmission', variance: 'Year-over-year variance', attention: 'Needs a decision' };

    return `
    <div class="view">
      <div class="view-head">
        <div>
          <div class="row" style="gap:9px">
            <h1>${esc(c.name)}</h1>${pill(c.stage)}
          </div>
          <p>${esc(c.entity)} · ${esc(c.filing)} · return <span class="mono">${c.id}</span> · prepared by ${esc(staffName(c.preparer))} · due ${fmt.dateFull(c.due)}</p>
        </div>
        <div class="spacer"></div>
        <div class="row">
          <button class="btn" data-action="open-client" data-arg="${c.id}">Client record</button>
          <button class="btn btn-primary" data-action="ready-for-review" data-arg="${c.id}"
            ${blockers.length || c.stage !== 'prep' ? 'disabled' : ''}
            title="${blockers.length ? 'Clear the blocking diagnostic first' : c.stage !== 'prep' ? 'This return has already left preparation' : ''}">
            Send to review
          </button>
        </div>
      </div>

      ${blockers.length ? `
      <div class="banner" data-tone="error" style="margin-bottom:16px">
        <span class="sev"></span>
        <div>
          <b>${blockers.length === 1 ? 'One issue blocks transmission' : `${blockers.length} issues block transmission`}</b>
          <p>${esc(blockers[0].title)}. A return cannot be sent to review or to the IRS while a blocking diagnostic is open.</p>
        </div>
      </div>` : ''}

      <div class="grid" style="grid-template-columns:minmax(260px, 330px) minmax(0,1fr)">
        <section class="panel" style="align-self:start">
          <div class="panel-head"><h2>Forms</h2><span class="spacer"></span><span class="panel-note">${done} of ${forms.length} complete</span></div>
          <div class="panel-body">
            ${forms.map((f) => `
              <div class="checkitem" data-done="${f.state === 'done'}">
                <span class="box">${f.state === 'done' ? '✓' : f.state === 'open' ? '·' : ''}</span>
                <div>
                  <div class="what">${esc(f.form)}</div>
                  ${f.note ? `<div class="why">${esc(f.note)}</div>` : ''}
                  ${f.state === 'notstarted' ? '<div class="why">Not started</div>' : ''}
                </div>
                <span></span>
              </div>`).join('')}
          </div>
          <div class="panel-foot">
            <span class="panel-note">Signature: ${signatureOf(c.id) ? (signatureOf(c.id).signed ? `Form 8879 signed ${fmt.date(signatureOf(c.id).signed.slice(0,10))}` : 'Form 8879 sent, unsigned') : 'Form 8879 not sent'}</span>
          </div>
        </section>

        <div class="stack">
          <section class="panel">
            <div class="panel-head">
              <h2>Diagnostics</h2>
              <span class="spacer"></span>
              <span class="panel-note">${diags.filter((d) => !d.resolved).length} open</span>
            </div>
            ${diags.length ? diags.map((d) => `
              <div class="diag" data-sev="${d.sev}" data-resolved="${d.resolved}">
                <div class="sev"></div>
                <div>
                  <div class="diag-title">
                    <b>${esc(d.title)}</b>
                    <span class="diag-kind">${sevLabel[d.sev]}</span>
                    <span class="panel-note mono">${d.code}</span>
                  </div>
                  <p class="diag-body">${esc(d.body)}</p>
                  ${d.resolved ? '<p class="panel-note" style="margin-top:6px">Cleared by ' + esc(staffName(c.preparer)) + ' today.</p>' : `
                  <div class="diag-actions">
                    <button class="btn btn-sm" data-action="resolve-diag" data-arg="${c.id}::${d.code}">${d.sev === 'block' ? 'Mark resolved' : d.sev === 'variance' ? 'Add explanation note' : 'Record the decision'}</button>
                    ${d.link ? `<button class="btn btn-sm btn-quiet" data-action="goto" data-arg="${d.link}">${esc(d.action)}</button>` : ''}
                  </div>`}
                </div>
              </div>`).join('')
            : `<div class="empty" style="padding:30px">
                <h3>No diagnostics</h3>
                <p>Nothing in this return trips a check. It is ready for a reviewer to read rather than to fix.</p>
              </div>`}
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Against last year</h2>
              <span class="spacer"></span>
              <span class="panel-note">${SEASON.taxYear} compared with ${SEASON.taxYear - 1} as filed</span>
            </div>
            <div class="panel-body">${comparisonTable(c)}</div>
          </section>
        </div>
      </div>
    </div>`;
  }
};

/* ── 7. Review queue ───────────────────────────────────────────────────── */

const ReviewScreen = {
  crumb: 'Review queue',
  render(params) {
    const queue = byStage('review');

    if (!queue.length) {
      return `
      <div class="view">
        <div class="view-head"><div><h1>Review queue</h1></div></div>
        <section class="panel"><div class="empty">
          <div class="empty-mark"></div>
          <h3>The queue is clear</h3>
          <p>Nothing is waiting on a reviewer. ${readyToTransmit().length} signed ${readyToTransmit().length === 1 ? 'return is' : 'returns are'} ready to go to the IRS.</p>
          <button class="btn btn-primary" data-action="goto" data-arg="#/efile">Open the e-file centre</button>
        </div></section>
      </div>`;
    }

    const current = queue.find((c) => c.id === params[0]) || queue[0];
    const diff = REVIEW_DIFFS[current.id];
    const noteKey = `review::${current.id}`;
    const noteErr = App.state.drafts[`err::${noteKey}`];

    const list = queue.map((c) => `
      <button class="stagerow" style="grid-template-columns:minmax(0,1fr) auto; padding:11px 14px; align-items:start"
              data-action="goto" data-arg="#/review/${c.id}" aria-current="${c.id === current.id ? 'true' : 'false'}">
        <span>
          <span style="font-weight:600">${esc(c.name)}</span>
          <span style="display:block; color:var(--text-muted); font-size:12.5px">
            ${esc(c.entity)} · from ${esc(staffName(c.preparer))} · ${stuckDays(c)} ${stuckDays(c) === 1 ? 'day' : 'days'} in review
          </span>
        </span>
        <span class="panel-note" style="white-space:nowrap">due ${fmt.date(c.due)}</span>
      </button>`).join('');

    return `
    <div class="view">
      <div class="view-head">
        <div>
          <h1>Review queue</h1>
          <p>${queue.length} ${queue.length === 1 ? 'return is' : 'returns are'} with a reviewer. A return leaves review in one direction or the other, and either way it carries a note.</p>
        </div>
      </div>

      <div class="grid" style="grid-template-columns:minmax(280px, 340px) minmax(0,1fr)">
        <section class="panel" style="align-self:start">
          <div class="panel-head"><h2>Waiting</h2><span class="spacer"></span><span class="panel-note">${queue.length}</span></div>
          ${list}
        </section>

        <section class="panel">
          <div class="panel-head">
            <h2>${esc(current.name)}</h2>
            <span class="panel-note">${esc(current.entity)} · <span class="mono">${current.id}</span></span>
            <span class="spacer"></span>
            <button class="btn btn-sm" data-action="goto" data-arg="#/return/${current.id}">Open return workspace</button>
          </div>

          <div class="panel-body">
            ${diff ? `
              <div class="row" style="justify-content:space-between; margin-bottom:12px">
                <span class="panel-note">Reviewed by ${esc(staffName(diff.reviewer))}, ${diff.minutes} minutes, ${diff.changes.length} changes</span>
                <span class="panel-note">Received ${fmt.stamp(diff.received)} from ${esc(staffName(diff.preparer))}</span>
              </div>
              ${diff.changes.map((ch) => `
                <div class="diffrow">
                  <div class="row" style="gap:8px">
                    <b style="font-size:13.5px">${esc(ch.field)}</b>
                    <span class="panel-note">${esc(ch.form)}</span>
                  </div>
                  <div class="diffline">
                    <div class="diffbox before">${esc(ch.before)}</div>
                    <div class="diffarrow">→</div>
                    <div class="diffbox after">${esc(ch.after)}</div>
                  </div>
                  <p class="panel-note" style="max-width:80ch">${esc(ch.why)}</p>
                </div>`).join('')}
              ${diff.delta.refundBefore !== diff.delta.refundAfter ? `
                <div class="banner" data-tone="warn" style="margin:14px 0">
                  <span class="sev"></span>
                  <div>
                    <b>The result changed in review</b>
                    <p>Refund moved from ${fmt.money(diff.delta.refundBefore)} to ${fmt.money(diff.delta.refundAfter)}. The client was told the earlier figure on the phone, so someone has to make that call before the 8879 goes out.</p>
                  </div>
                </div>` : ''}
            ` : `<p class="panel-note">No reviewer edits recorded yet.</p>`}

            <div style="max-width:640px; margin-top:6px">
              <label class="field ${noteErr ? 'field-error' : ''}">
                <span>Reviewer note — required either way</span>
                <textarea id="reviewnote" data-draft="${noteKey}" placeholder="What you changed, or what the preparer needs to fix.">${esc(App.draft(noteKey))}</textarea>
              </label>
              ${noteErr ? `<p class="errortext" style="margin-top:6px">⚑ ${esc(noteErr)}</p>` : ''}
              <div class="row" style="margin-top:12px">
                <button class="btn btn-primary" data-action="review-approve" data-arg="${current.id}">Approve and send for signature</button>
                <button class="btn" data-action="review-return" data-arg="${current.id}">Return to preparer</button>
              </div>
            </div>
          </div>
        </section>
      </div>
    </div>`;
  },

  after() {
    const t = $('#reviewnote');
    if (t) t.addEventListener('input', (e) => App.draft(e.target.dataset.draft, e.target.value));
  }
};

/* ── 8. E-file centre ──────────────────────────────────────────────────── */

const EfileScreen = {
  crumb: 'E-file centre',
  render() {
    const ready = readyToTransmit();
    const inFlight = byStage('transmitted');
    const rejects = byStage('rejected');

    const readyRows = ready.map((c) => {
      const sig = signatureOf(c.id);
      return `
      <tr>
        <td><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.entity)} · ${esc(staffName(c.preparer))}</div></td>
        <td class="tight mono">${c.id}</td>
        <td class="tight">Signed ${fmt.stamp(sig.signed)}</td>
        <td class="tight">${esc(sig.method)}</td>
        <td class="tight r">${fmt.date(c.due)}</td>
        <td class="tight r">${fmt.outcome(c.current.result)}</td>
      </tr>`;
    }).join('');

    return `
    <div class="view">
      <div class="view-head">
        <div>
          <h1>E-file centre</h1>
          <p>Transmitting with EFIN <span class="mono">${SEASON.efin}</span>. Transmission is final — a filed return can only be changed by amending it on Form 1040-X.</p>
        </div>
        <div class="spacer"></div>
        <button class="btn btn-primary" data-action="transmit-ready" ${ready.length ? '' : 'disabled'}>
          Transmit ${ready.length} to IRS
        </button>
      </div>

      ${App.state.ackServiceDown ? `
      <div class="banner" data-tone="error" style="margin-bottom:16px">
        <span class="sev"></span>
        <div>
          <b>The IRS acknowledgment service did not respond</b>
          <p>The last request to the Modernized e-File system timed out after 30 seconds. Returns already transmitted are still filed — this affects only our ability to read acknowledgments back. Nothing needs retransmitting.</p>
        </div>
        <button class="btn btn-sm" data-action="check-acks">Try again</button>
      </div>` : ''}

      <div class="stack">
        <section class="panel">
          <div class="panel-head">
            <h2>Signed and ready to transmit</h2>
            <span class="spacer"></span>
            <span class="panel-note">Form 8879 on file for each</span>
          </div>
          ${ready.length ? `
          <div class="tablewrap"><table class="ledger">
            <thead><tr><th>Client</th><th>Return</th><th>Signature</th><th>Method</th><th class="r">Due</th><th class="r">Result</th></tr></thead>
            <tbody>${readyRows}</tbody>
          </table></div>` : `
          <div class="empty" style="padding:34px">
            <div class="empty-mark"></div>
            <h3>Nothing is waiting to transmit</h3>
            <p>Returns appear here the moment a client signs Form 8879. ${byStage('signature').length} ${byStage('signature').length === 1 ? 'client has' : 'clients have'} been sent one and not signed yet.</p>
            <button class="btn" data-action="goto" data-arg="#/clients">See who has not signed</button>
          </div>`}
        </section>

        <div class="grid cols-2">
          <section class="panel">
            <div class="panel-head">
              <h2>In flight</h2>
              <span class="spacer"></span>
              <button class="btn btn-sm" data-action="check-acks" ${inFlight.length ? '' : 'disabled'}>Check for acknowledgments</button>
            </div>
            ${inFlight.length ? `
            <div class="tablewrap"><table class="ledger">
              <thead><tr><th>Client</th><th>Batch</th><th>Transmitted</th><th class="r">Waiting</th></tr></thead>
              <tbody>${inFlight.map((c) => {
                const sent = (c.ack && c.ack.transmitted) || SEASON.today + 'T09:00:00';
                return `<tr>
                  <td><div class="name">${esc(c.name)}</div><div class="sub">${esc(c.entity)}</div></td>
                  <td class="mono">${esc((c.ack && c.ack.batch) || '—')}</td>
                  <td>${fmt.time(sent)}</td>
                  <td class="r">${Math.max(0, Math.round((new Date(SEASON.today + 'T09:20:00') - new Date(sent)) / 60000))} min</td>
                </tr>`;
              }).join('')}</tbody>
            </table></div>` : `<div class="empty" style="padding:28px"><h3>Nothing in flight</h3><p>Every transmitted return has been acknowledged.</p></div>`}
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Rejected — triage</h2>
              <span class="spacer"></span>
              <span class="panel-note">${rejects.length} to resolve</span>
            </div>
            ${rejects.length ? rejects.map((c) => `
              <div class="risk" data-sev="critical" data-action="goto" data-arg="#/reject/${c.id}" tabindex="0" role="link">
                <div class="risk-strip">
                  <div class="sev"></div>
                  <div>
                    <div class="risk-top">
                      <span class="risk-name">${esc(c.name)}</span>
                      <span class="mono" style="font-size:12.5px">${c.reject.code}</span>
                      <span class="panel-note">attempt ${c.reject.attempt} · ${fmt.stamp(c.reject.rejected)}</span>

                  </div>

            : `<div class="empty" style="padding:28px"><h3>Nothing rejected</h3><p>Every return the IRS has looked at came back accepted.</p></div>`}
          </section>
        </div>

        <section class="panel">
          <div class="panel-head"><h2>Batch history</h2><span class="spacer"></span><span class="panel-note">Season to date: ${SEASON.closedToDate.accepted} accepted</span></div>
          <div class="tablewrap"><table class="ledger">
            <thead><tr><th>Batch</th><th>Transmitted</th><th class="r">Returns</th><th>Outcome</th><th>Notes</th></tr></thead>
            <tbody>${App.state.batches.map((b) => `
              <tr>
                <td class="mono">${b.id}</td>
                <td>${fmt.stamp(b.sent)}</td>
                <td class="r num">${b.count}</td>

          </table></div>
        </section>
      </div>
    </div>`;
  }
};

/* ── 9. Reject resolution ──────────────────────────────────────────────── */

const RejectScreen = {
  crumb(params) { const c = App.client(params[0]); return c ? `Reject — ${c.name}` : 'Reject'; },

  render(params) {
    const c = App.client(params[0]);
    if (!c || !c.reject) return NotFoundScreen.render();
    const lib = REJECT_LIBRARY[c.reject.code];
    const steps = lib.fix.map((s, i) => ({ text: s, done: App.state.drafts[`fix::${c.id}::${i}`] === 'done' }));
    const allDone = steps.every((s) => s.done);
    const resolved = c.stage !== 'rejected';

    return `
    <div class="view">
      <div class="view-head">
        <div>
          <div class="row" style="gap:9px"><h1>${esc(c.name)}</h1>${pill(c.stage)}</div>
          <p>${esc(c.entity)} · <span class="mono">${c.id}</span> · transmitted ${fmt.stamp(c.reject.transmitted)} in batch <span class="mono">${c.reject.batch}</span> · attempt ${c.reject.attempt}</p>
        </div>
        <div class="spacer"></div>
        <div class="row">
          <button class="btn" data-action="open-client" data-arg="${c.id}">Client record</button>
          <button class="btn btn-primary" data-action="retransmit" data-arg="${c.id}" ${allDone && !resolved ? '' : 'disabled'}
            title="${resolved ? 'Already retransmitted' : allDone ? '' : 'Work the fix path first'}">Retransmit to IRS</button>
        </div>
      </div>

      <div class="grid" style="grid-template-columns:minmax(0,1.5fr) minmax(280px,1fr)">
        <div class="stack">
          <section class="panel">
            <div class="panel-body" style="padding:18px">
              <h2 style="font-size:17px; max-width:62ch">${esc(lib.plain)}</h2>
              <p style="color:var(--text-muted); margin-top:10px; max-width:74ch">${esc(lib.cause)}</p>
              <div class="row" style="gap:20px; margin-top:16px; padding-top:14px; border-top:1px solid var(--rule-hair)">
                <div>
                  <div class="panel-note">IRS business rule</div>
                  <div class="mono" style="font-size:15px; margin-top:2px">${c.reject.code}</div>
                </div>
                <div style="max-width:62ch">
                  <div class="panel-note">What the rule says</div>
                  <div style="font-size:13px; margin-top:2px">${esc(lib.official)}</div>
                </div>
              </div>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head">
              <h2>Fix path</h2>
              <span class="spacer"></span>
              <span class="panel-note">${steps.filter((s) => s.done).length} of ${steps.length} done</span>
            </div>
            <div class="panel-body">
              ${steps.map((s, i) => `
                <div class="checkitem" data-done="${s.done}">
                  <span class="box">${s.done ? '✓' : ''}</span>
                  <div><div class="what">${esc(s.text)}</div></div>
                  <div>${resolved ? '' : `<button class="btn btn-sm" data-action="fix-step" data-arg="${c.id}::${i}">${s.done ? 'Undo' : 'Done'}</button>`}</div>
                </div>`).join('')}

              ${resolved ? `
                <div class="banner" data-tone="info" style="margin-top:14px">
                  <span class="sev"></span>
                  <div><b>Retransmitted</b><p>Sent back to the IRS today. Acknowledgments for a corrected return usually come back within the hour.</p></div>
                  <button class="btn btn-sm" data-action="goto" data-arg="#/efile">E-file centre</button>
                </div>`
              : !allDone ? `<p class="panel-note" style="margin-top:12px">Retransmission stays disabled until the fix path is worked. A second reject on the same rule is what turns a two-day delay into a two-week one.</p>` : `
                <div class="banner" data-tone="info" style="margin-top:14px">
                  <span class="sev"></span>
                  <div><b>Ready to retransmit</b><p>${lib.retransmit ? 'The return itself has not changed in a way that requires a new Form 8879.' : 'A new Form 8879 is required before this can go back.'}</p></div>
                </div>`}
            </div>
          </section>
        </div>

        <div class="stack">
          <section class="panel">
            <div class="panel-head"><h2>What it costs the client</h2></div>
            <div class="panel-body">
              <div class="kv"><span class="k">Expected result</span><span class="v">${fmt.outcome(c.current.result)}</span></div>
              <div class="kv"><span class="k">Filing deadline</span><span class="v">${fmt.dateFull(c.due)}, ${daysToDeadline} days away</span></div>
              <div class="kv"><span class="k">Rejected</span><span class="v">${fmt.stamp(c.reject.rejected)}</span></div>
              <div class="kv"><span class="k">Time to acknowledge</span><span class="v">${Math.round((new Date(c.reject.rejected) - new Date(c.reject.transmitted)) / 60000)} minutes</span></div>
              <p class="panel-note" style="margin-top:10px">A rejected return is not a late return. The IRS gives a five-day perfection period from the rejection to resubmit, and the original transmission date holds.</p>
            </div>
          </section>

          <section class="panel">
            <div class="panel-head"><h2>Notes on file</h2></div>
            <div class="panel-body stack" style="gap:12px">
              ${c.notes.map((n) => `
                <div class="note">
                  <div class="note-meta">${fmt.dateFull(n.on)} · ${esc(staffName(n.by))}</div>
                  <p class="note-text">${esc(n.text)}</p>
                </div>`).join('')}
            </div>
          </section>
        </div>
      </div>
    </div>`;
  }
};

/* ── 10. Deadline board ────────────────────────────────────────────────── */

const BOARD_COLUMNS = [
  { key: SEASON.businessDue,   when: 'Monday 16 March',   what: 'Form 1065 and 1120-S', note: 'March 15 is a Sunday this year, so the partnership and S-corp deadline moves to the Monday.', urgent: true },
  { key: SEASON.individualDue, when: 'Wednesday 15 April', what: 'Form 1040',            note: 'Individual returns, and the last day to file Form 4868.' },
  { key: SEASON.extendedDue,   when: 'Thursday 15 October', what: 'Extended on Form 4868', note: 'Filing extended. Tax owed was still due on 15 April.' },
  { key: 'done',               when: 'Filed',              what: 'Accepted by the IRS',   note: 'Off the board. Nothing here needs a date.' }
];

const DeadlineScreen = {
  crumb: 'Deadline board',
  render() {
    const columns = BOARD_COLUMNS.map((col) => {
      const cards = App.state.clients.filter((c) =>
        col.key === 'done' ? ['accepted', 'invoiced'].includes(c.stage)
                           : c.due === col.key && !['accepted', 'invoiced'].includes(c.stage));
      return { ...col, cards };
    });

    return `
    <div class="view">
      <div class="view-head">
        <div>
          <h1>Deadline board</h1>
          <p>Every open return by the date it is actually due. Drag a card to a different column, or use the buttons on the card — either one files or withdraws the extension and updates the client record.</p>
